<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — llm-slop</title>
<meta name="description" content="This page was not generated. Yet.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08070d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2308070d'/%3E%3Crect x='11' y='29' width='42' height='6' rx='3' fill='%23c6ff3f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--void:#08070d;--panel:#100f19;--line:#242232;--text:#eae8f2;--dim:#8a85a0;--dimmer:#5d5972;--slop:#c6ff3f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--void);color:var(--text);
  font-family:"Space Grotesk",system-ui,sans-serif;font-size:17px;line-height:1.55;
  display:flex;align-items:center;justify-content:center;padding:32px;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;opacity:.28;
  mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 20%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 20%,transparent 75%)}
main{position:relative;max-width:560px;text-align:center}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.code{font-size:13px;color:var(--dimmer);border:1px solid var(--line);background:var(--panel);
  padding:6px 14px;border-radius:99px;display:inline-block;margin-bottom:30px}
h1{margin:0;font-size:clamp(38px,7vw,62px);line-height:1.05;letter-spacing:-.045em;font-weight:700}
p{margin:22px 0 0;color:var(--dim)}
.fine{margin-top:14px;font-size:12.5px;color:var(--dimmer)}
.btn{display:inline-block;margin-top:34px;border-radius:9px;padding:13px 24px;font-size:15px;
  font-weight:700;text-decoration:none;background:var(--slop);color:#0b1300;border:1px solid var(--slop)}
:focus-visible{outline:2px solid var(--slop);outline-offset:3px;border-radius:4px}
</style>
</head>
<body>
<main>
  <p class="code mono">404 · not generated</p>
  <h1>This page doesn't exist yet.</h1>
  <p>Which puts it slightly ahead of the rest of the site, where the pages exist but say nothing.</p>
  <p class="fine mono">Our model could generate this page in 0.4s. It would be 40,000 words and also wrong.</p>
  <a class="btn" href="/">Back to the slop</a>
</main>
</body>
</html>
