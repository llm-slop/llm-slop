<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#08070d;color:#eae8f2;
  font-family:"Space Grotesk",system-ui,sans-serif;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#242232 1px,transparent 1px),linear-gradient(90deg,#242232 1px,transparent 1px);
  background-size:64px 64px;opacity:.30;
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 20%,transparent 78%)}
.glow{position:absolute;width:760px;height:460px;left:-140px;top:-190px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(139,108,246,.20),transparent)}
.in{position:relative;padding:64px 68px;height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px}
.brand{font-size:34px;font-weight:700;letter-spacing:-.045em}
.brand i{color:#c6ff3f;font-style:normal}
.ver{font-family:"IBM Plex Mono",monospace;font-size:15px;color:#5d5972;
  border:1px solid #242232;padding:6px 13px;border-radius:99px}
h1{margin-top:auto;font-size:112px;line-height:.97;letter-spacing:-.05em;font-weight:700}
.dash{display:block;width:150px;height:12px;border-radius:6px;background:#c6ff3f;margin:34px 0 30px}
.sub{font-size:27px;color:#8a85a0;max-width:880px;line-height:1.4}
.badges{display:flex;gap:11px;margin-top:auto;padding-top:44px;font-family:"IBM Plex Mono",monospace}
.b{border:1px solid #242232;background:#100f19;border-radius:8px;padding:9px 15px;font-size:15px;color:#5d5972}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="in">
  <div class="top"><div class="brand">llm<i>-</i>slop</div><div class="ver">v4.1-turbo-preview-final-v2</div></div>
  <h1>Say nothing,<br>at scale.</h1>
  <span class="dash"></span>
  <p class="sub">Thought leadership, README files, and changelog entries that are functionally indistinguishable from content.</p>
  <div class="badges">
    <span class="b">41,000 words per idea</span>
    <span class="b">SOC 2 Type II (self-attested)</span>
    <span class="b">0 original thoughts</span>
  </div>
</div></body></html>
